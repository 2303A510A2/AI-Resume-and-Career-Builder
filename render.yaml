services:
  - type: web
    name: ai-resume-career-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is intentionally NOT set: Render injects its own PORT and the
      # backend binds process.env.PORT (server.js falls back to 5000 locally).
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_COLLECTION
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # One-time Main Admin Leader bootstrap. The backend never reads these
      # values from a request and never overwrites an existing main admin.
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_EXPIRES_IN
        value: 8h
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAG_TOP_K
        value: 6
      - key: RAG_CHUNK_SIZE
        value: 800
      - key: RAG_CHUNK_OVERLAP
        value: 120

  - type: web
    name: ai-resume-career-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-resume-and-career-builder-1.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /react-app.html